<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>섭외문의 | (주)투머치엔터테이먼트</title>
  <meta name="description" content="모델·인플루언서 섭외 문의 및 프로필 접수.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%23fff'%3ET%3C/text%3E%3Crect x='44' y='36' width='8' height='8' fill='%23ff4a1c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body data-page="contact">
  <div id="header"></div>

  <main>
    <section class="page-hero" style="padding-bottom:clamp(56px,8vw,112px)">
      <div class="wrap">
        <h1 class="h-en">Contact</h1>
        <p>브랜드에 맞는 모델 · 인플루언서를 빠르고 정확하게 제안드립니다.</p>
      </div>
    </section>

    <section class="sec paper" id="ask">
      <div class="wrap ask">
        <div class="ask-side">
          <span class="eyebrow">INQUIRY</span>
          <h2 class="title">섭외 문의</h2>
          <p class="lead">아는 만큼만 적어주셔도 괜찮습니다. 담당자가 확인 후 연락드립니다.</p>
          <dl>
            <div><dt>E-MAIL</dt><dd><a data-site="email"></a></dd></div>
            <div><dt>ADDRESS</dt><dd data-site="address"></dd></div>
          </dl>
        </div>

        <form class="ask-form" id="askForm">
          <label>문의 구분 <select name="type" required>
            <option>모델 캐스팅</option>
            <option>인플루언서 마케팅</option>
            <option>행사 · 의전</option>
            <option>촬영대행</option>
            <option>기타</option>
          </select></label>
          <label><span>회사 / 브랜드명 <i>*</i></span><input name="company" required autocomplete="organization"></label>
          <label><span>담당자명 <i>*</i></span><input name="name" required autocomplete="name"></label>
          <label><span>연락처 <i>*</i></span><input name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000"></label>
          <label><span>이메일 <i>*</i></span><input name="email" type="email" required autocomplete="email"></label>
          <label>진행 예정일 <input name="date" type="date"></label>
          <label class="full">예산 <input name="budget" placeholder="예) 000만원 / 미정"></label>
          <label class="full"><span>문의 내용 <i>*</i></span><textarea name="message" required placeholder="촬영(행사) 내용, 필요한 인원과 이미지, 사용 매체와 기간 등을 적어주세요."></textarea></label>
          <label class="agree full"><input type="checkbox" required> 문의 응대를 위한 개인정보(이름, 연락처, 이메일) 수집 · 이용에 동의합니다.</label>
          <div class="full">
            <button class="btn" type="submit">문의 보내기 →</button>
            <p class="note" id="formNote" hidden style="margin-top:12px">메일 앱이 열리면 전송 버튼을 눌러주세요. 열리지 않으면 위 이메일 주소로 직접 보내주셔도 됩니다.</p>
          </div>
        </form>
      </div>
    </section>

    <section class="sec dark">
      <div class="wrap join">
        <div>
          <span class="eyebrow">JOIN US</span>
          <h2 class="title">투머치와 함께할<br>모델 · 인플루언서를 찾습니다</h2>
          <p class="lead">프로필 사진, 신체 사이즈(또는 SNS 계정), 연락처를 메일로 보내주세요. 검토 후 개별 연락드립니다.</p>
        </div>
        <a class="btn line" id="profileMail" href="#">프로필 접수하기 →</a>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js?v=5"></script>
  <script src="js/site.js?v=4"></script>
</body>
</html>
